[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailiq"
version = "1.0.0"
description = "Reproducible retail demand forecasting and inventory decision system"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2", "plotly>=5,<7", "streamlit>=1.30,<2"]

[project.optional-dependencies]
boost = ["lightgbm>=4,<5"]
explain = ["shap>=0.44,<1"]
dev = ["pytest>=7,<10", "ruff>=0.5,<1"]

[project.scripts]
retailiq = "retailiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
